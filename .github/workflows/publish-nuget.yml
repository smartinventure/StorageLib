name: Publish to NuGet

# Publishes SmartInVenture.StorageLib to nuget.org using Trusted Publishing (OIDC).
# No API key/secret is stored — GitHub Actions proves its identity to nuget.org via
# OIDC and receives a short-lived token. This requires a Trusted Publisher Policy on
# nuget.org bound to:
#   Package Owner = smartinventure, Repository Owner = smartinventure,
#   Repository = StorageLib, Workflow File = publish-nuget.yml
#
# Two ways to trigger:
#   1. Create a GitHub Release with a tag like "v1.0.1"  -> publishes version 1.0.1
#   2. Run this workflow manually (Actions tab) and type the version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1)"
        required: true

permissions:
  id-token: write   # required for Trusted Publishing (OIDC token exchange)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"     # strip leading "v" from the tag
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: NuGet login (Trusted Publishing / OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: smartinventure   # nuget.org package owner

      - name: Restore
        run: dotnet restore StorageLib.sln

      - name: Build
        run: >
          dotnet build StorageLib.sln
          --configuration Release
          --no-restore
          -p:GeneratePackageOnBuild=false
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Pack core
        run: >
          dotnet pack StorageLib/StorageLib.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.ver.outputs.version }}
          --output ${{ github.workspace }}/artifacts

      - name: Pack OpenSlide
        run: >
          dotnet pack StorageLib.OpenSlide/StorageLib.OpenSlide.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.ver.outputs.version }}
          --output ${{ github.workspace }}/artifacts

      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
